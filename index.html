<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live to Give Campaign · ISKCON London</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<header class="header">
    <img class="logo" id="logo" alt="ISKCON London" hidden>
    <h1>Live to Give Campaign</h1>
</header>

<main class="dashboard">
    <section class="chart-panel">
        <div class="chart-container"><canvas id="ltgChart"></canvas></div>
    </section>

    <section class="stats-grid">
        <div class="stat-col">
            <div class="stat-card">
                <div class="stat-year muted">2025</div>
                <div class="kpis">
                    <div class="kpi">
                        <div class="kpi-label">Goal</div>
                        <div class="kpi-value">28,000</div>
                    </div>
                    <div class="kpi">
                        <div class="kpi-label">Achieved</div>
                        <div class="kpi-value" id="done2025">–</div>
                    </div>
                </div>
            </div>
            <div class="start-note">Started <strong>8 Sep 2025</strong></div>
        </div>

        <div class="stat-col">
            <div class="stat-card current">
                <div class="stat-year">2026</div>
                <div class="kpis">
                    <div class="kpi">
                        <div class="kpi-label">Goal</div>
                        <div class="kpi-value">31,000</div>
                    </div>
                    <div class="kpi">
                        <div class="kpi-label">Done so far</div>
                        <div class="kpi-value loading" id="done2026">…</div>
                    </div>
                    <div class="kpi">
                        <div class="kpi-label">Progress</div>
                        <div class="kpi-value green" id="pct2026">–</div>
                    </div>
                </div>
                <div class="progress"><div id="progress2026"></div></div>
            </div>
            <div class="start-note">Started <strong>27 Sep 2026</strong></div>
            <div class="count-note">Counting: Bhagavad Gita (Medium) = <strong>1.5</strong> · Bhagavad Gita (Premium) = <strong>3</strong> · other Gitas = 1</div>
        </div>
    </section>
</main>

<script>
    const CAMPAIGN_2025 = {
        start: '2025-09-08',
        end: '2026-01-07',
        goal: 28000,
        weekly: [961, 674, 532, 695, 1749, 947, 700, 796, 603, 212, 898, 1730, 8237, 4720, 105, 6609, 289, 131],
    };
    const CAMPAIGN_2026 = {
        start: '2026-09-27',
        goal: 31000,
    };

    const COLORS = {
        gold: '#f0b429',
        lastYear: '#6b7499',
        legend: '#8c9bb4',
        ticks: '#8c9bb4',
        grid: 'rgba(240, 180, 41, 0.08)',
        tooltipBg: 'rgba(26, 34, 64, 0.98)',
        tooltipBorder: 'rgba(240, 180, 41, 0.25)',
        text: '#f4f6ff',
    };

    // Dates are compared by calendar position: x = days since 1 Sep of the
    // campaign's start year, so e.g. 1 Dec 2025 and 1 Dec 2026 share an x.
    const DAY_MS = 24 * 60 * 60 * 1000;
    const nf = new Intl.NumberFormat('en-GB');

    function parseUTC(s) {
        const [y, m, d] = s.split('-').map(Number);
        return Date.UTC(y, m - 1, d);
    }
    function seasonDay(ms, year) {
        return Math.round((ms - Date.UTC(year, 8, 1)) / DAY_MS);
    }
    function dayLabel(x) {
        // x is "end of day x-1"; label with that last day.
        return new Date(Date.UTC(2026, 8, 1) + (x - 1) * DAY_MS)
            .toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
    }

    // Cumulative 2025 curve at its real week-end positions.
    function curve2025() {
        const startMs = parseUTC(CAMPAIGN_2025.start);
        const endMs = parseUTC(CAMPAIGN_2025.end);
        const pts = [{ x: seasonDay(startMs, 2025), y: 0 }];
        let cum = 0;
        CAMPAIGN_2025.weekly.forEach((v, i) => {
            const lastDay = Math.min(startMs + (7 * i + 6) * DAY_MS, endMs);
            cum += v;
            pts.push({ x: seasonDay(lastDay, 2025) + 1, y: cum });
        });
        return pts;
    }
    function valueAt(pts, x) {
        if (x <= pts[0].x) return 0;
        for (let i = 1; i < pts.length; i++) {
            if (x <= pts[i].x) {
                const a = pts[i - 1], b = pts[i];
                return a.y + (b.y - a.y) * (x - a.x) / (b.x - a.x);
            }
        }
        return pts[pts.length - 1].y;
    }

    function render(weekly2026) {
        const c25 = curve2025();
        const total2025 = c25[c25.length - 1].y;
        const weeks = weekly2026 || [];

        // Shared weekly grid aligned to 2026 week ends, extended back to cover 2025's start
        // and forward to cover whichever campaign ends later.
        const start26 = seasonDay(parseUTC(CAMPAIGN_2026.start), 2026);
        const last25 = c25[c25.length - 1].x;
        const end26 = start26 + 7 * Math.max(weeks.length, 1);
        let first = start26;
        while (first > c25[0].x) first -= 7;
        const grid = [];
        for (let x = first; x < Math.max(last25, end26) + 7; x += 7) grid.push(x);

        // Series on the shared grid.
        let reached25 = false;
        const data2025 = grid.map(x => {
            if (reached25) return null;
            if (x >= last25) reached25 = true;
            return Math.round(valueAt(c25, x));
        });
        let cum = 0, stopped = false;
        const data2026 = grid.map(x => {
            if (x < start26) return null;
            if (x === start26) return 0;
            const w = (x - start26) / 7 - 1;
            const v = weeks[w];
            if (stopped || v === null || v === undefined || v === '') { stopped = true; return null; }
            cum += Number(v);
            return cum;
        });
        const total2026 = cum;

        // Per-week amounts on the shared grid (difference between consecutive totals).
        // For 2025 this is the same 7-day window last year.
        const toWeekly = arr => arr.map((v, i) => {
            if (v === null) return null;
            const prev = i > 0 ? arr[i - 1] : null;
            return prev === null ? null : v - prev;
        });
        const weekly2025Grid = toWeekly(data2025);
        const weekly2026Grid = toWeekly(data2026);

        const tooltipTitle = i => {
            const x = grid[i];
            const range = `${dayLabel(x - 6)} – ${dayLabel(x)}`;
            const w = (x - start26) / 7;
            return w >= 1 ? `Week ${w}  ·  ${range}` : range;
        };

        // Stats
        document.getElementById('done2025').textContent = nf.format(total2025);
        const done = document.getElementById('done2026');
        done.classList.remove('loading');
        if (weekly2026) {
            const pct = total2026 / CAMPAIGN_2026.goal * 100;
            done.textContent = nf.format(total2026);
            document.getElementById('pct2026').textContent = pct.toFixed(1) + '%';
            requestAnimationFrame(() => {
                document.getElementById('progress2026').style.width = Math.min(pct, 100) + '%';
            });
        } else {
            done.textContent = '—';
        }

        // Chart
        Chart.defaults.color = COLORS.ticks;
        Chart.defaults.font.family = "'Inter', sans-serif";

        const canvas = document.getElementById('ltgChart');
        const ctx = canvas.getContext('2d');
        const h = canvas.parentElement.clientHeight;
        const goldFill = ctx.createLinearGradient(0, 0, 0, h);
        goldFill.addColorStop(0, 'rgba(240, 180, 41, 0.35)');
        goldFill.addColorStop(0.6, 'rgba(240, 180, 41, 0.08)');
        goldFill.addColorStop(1, 'rgba(240, 180, 41, 0.0)');
        const greyFill = ctx.createLinearGradient(0, 0, 0, h);
        greyFill.addColorStop(0, 'rgba(107, 116, 153, 0.18)');
        greyFill.addColorStop(1, 'rgba(107, 116, 153, 0.0)');

        const lastIndex = arr => {
            for (let i = arr.length - 1; i >= 0; i--) if (arr[i] !== null) return i;
            return -1;
        };

        // Soft glow under the 2026 line.
        const glowPlugin = {
            id: 'glow',
            beforeDatasetDraw(chart, args) {
                if (args.index !== 1) return;
                chart.ctx.save();
                chart.ctx.shadowColor = 'rgba(240, 180, 41, 0.55)';
                chart.ctx.shadowBlur = 14;
            },
            afterDatasetDraw(chart, args) {
                if (args.index === 1) chart.ctx.restore();
            },
        };

        // Pulsing "live" dot on the latest 2026 point + value tags at the end of each line.
        const endMarkersPlugin = {
            id: 'endMarkers',
            afterDatasetsDraw(chart) {
                const { ctx: c, chartArea } = chart;
                const tags = [
                    { ds: 0, bg: '#2a3357', fg: '#c3cbe0', border: 'rgba(140, 155, 180, 0.35)' },
                    { ds: 1, bg: COLORS.gold, fg: '#111827', border: COLORS.gold },
                ];

                // Pulse
                const i26 = lastIndex(chart.data.datasets[1].data);
                if (i26 > 0 && chart.isDatasetVisible(1)) {
                    const p = chart.getDatasetMeta(1).data[i26];
                    const t = (performance.now() % 1800) / 1800;
                    c.save();
                    c.beginPath();
                    c.arc(p.x, p.y, 6 + t * 14, 0, Math.PI * 2);
                    c.fillStyle = `rgba(240, 180, 41, ${0.45 * (1 - t)})`;
                    c.fill();
                    c.beginPath();
                    c.arc(p.x, p.y, 6, 0, Math.PI * 2);
                    c.fillStyle = COLORS.gold;
                    c.strokeStyle = '#111827';
                    c.lineWidth = 2;
                    c.fill();
                    c.stroke();
                    c.restore();
                }

                // Tags
                for (const tag of tags) {
                    if (!chart.isDatasetVisible(tag.ds)) continue;
                    const data = chart.data.datasets[tag.ds].data;
                    const idx = lastIndex(data);
                    if (idx < 1) continue;
                    const p = chart.getDatasetMeta(tag.ds).data[idx];
                    const text = nf.format(data[idx]);
                    c.save();
                    c.font = "700 13px 'Inter', sans-serif";
                    const w = c.measureText(text).width + 22;
                    const th = 28;
                    let x = Math.min(Math.max(p.x - w / 2, chartArea.left), chartArea.right - w);
                    let y = p.y - th - 14;
                    if (y < chartArea.top) y = p.y + 14;
                    c.beginPath();
                    c.roundRect(x, y, w, th, 14);
                    c.fillStyle = tag.bg;
                    c.shadowColor = 'rgba(0, 0, 0, 0.35)';
                    c.shadowBlur = 10;
                    c.fill();
                    c.shadowBlur = 0;
                    c.strokeStyle = tag.border;
                    c.lineWidth = 1;
                    c.stroke();
                    c.fillStyle = tag.fg;
                    c.textAlign = 'center';
                    c.textBaseline = 'middle';
                    c.fillText(text, x + w / 2, y + th / 2 + 1);
                    c.restore();
                }
            },
        };

        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: grid.map(dayLabel),
                datasets: [
                    {
                        label: '2025',
                        data: data2025,
                        borderColor: COLORS.lastYear,
                        backgroundColor: greyFill,
                        borderWidth: 2,
                        fill: true,
                        pointRadius: 0,
                        pointHoverRadius: 5,
                        pointHoverBackgroundColor: COLORS.lastYear,
                        tension: 0.35,
                    },
                    {
                        label: '2026',
                        data: data2026,
                        borderColor: COLORS.gold,
                        backgroundColor: goldFill,
                        borderWidth: 3,
                        fill: true,
                        pointRadius: c => (c.dataIndex > 0 && c.raw !== null ? 3.5 : 0),
                        pointBackgroundColor: '#111827',
                        pointBorderColor: COLORS.gold,
                        pointBorderWidth: 2,
                        pointHoverRadius: 7,
                        pointHoverBackgroundColor: COLORS.gold,
                        tension: 0.35,
                        spanGaps: false,
                    },
                ],
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: { padding: { top: 8, right: 12 } },
                interaction: { mode: 'index', intersect: false },
                animation: { duration: 1400, easing: 'easeOutQuart' },
                plugins: {
                    title: {
                        display: true,
                        text: '2025 vs 2026',
                        color: COLORS.text,
                        font: { size: 20, weight: 700 },
                        padding: { top: 6, bottom: 18 },
                    },
                    legend: {
                        labels: {
                            color: COLORS.legend,
                            usePointStyle: true,
                            pointStyle: 'circle',
                            boxWidth: 9,
                            boxHeight: 9,
                            padding: 28,
                            font: { size: 14, weight: 500 },
                            generateLabels: c => Chart.defaults.plugins.legend.labels.generateLabels(c).map(l => ({
                                ...l,
                                fillStyle: l.datasetIndex === 1 ? COLORS.gold : 'transparent',
                                strokeStyle: l.datasetIndex === 1 ? COLORS.gold : COLORS.lastYear,
                                lineWidth: 3,
                                lineDash: [],
                            })),
                        },
                    },
                    tooltip: {
                        backgroundColor: COLORS.tooltipBg,
                        titleColor: COLORS.text,
                        bodyColor: COLORS.text,
                        borderColor: COLORS.tooltipBorder,
                        borderWidth: 1,
                        padding: 16,
                        cornerRadius: 10,
                        titleFont: { size: 14, weight: 'bold' },
                        bodyFont: { size: 13, weight: 500 },
                        bodySpacing: 10,
                        titleMarginBottom: 12,
                        boxPadding: 8,
                        usePointStyle: true,
                        filter: c => c.parsed.y !== null && !Number.isNaN(c.parsed.y),
                        itemSort: (a, b) => b.datasetIndex - a.datasetIndex,
                        callbacks: {
                            title: items => (items.length ? tooltipTitle(items[0].dataIndex) : ''),
                            label: c => {
                                const wk = (c.datasetIndex === 1 ? weekly2026Grid : weekly2025Grid)[c.dataIndex];
                                const week = wk === null ? '' : `${nf.format(wk)} this week  ·  `;
                                return `${c.dataset.label}:  ${week}${nf.format(c.parsed.y)} total`;
                            },
                            labelPointStyle: () => ({ pointStyle: 'circle', rotation: 0 }),
                            labelColor: c => ({
                                borderColor: c.datasetIndex === 1 ? COLORS.gold : COLORS.lastYear,
                                backgroundColor: c.datasetIndex === 1 ? COLORS.gold : COLORS.lastYear,
                            }),
                        },
                    },
                },
                scales: {
                    x: {
                        grid: { color: COLORS.grid },
                        border: { display: false },
                        ticks: { color: COLORS.ticks, font: { size: 12, weight: 500 }, maxRotation: 0, autoSkipPadding: 16 },
                    },
                    y: {
                        beginAtZero: true,
                        suggestedMax: Math.max(CAMPAIGN_2026.goal, total2025) * 1.08,
                        grid: { color: COLORS.grid },
                        border: { display: false },
                        ticks: {
                            color: COLORS.ticks,
                            font: { size: 12, weight: 500 },
                            callback: v => (v >= 1000 ? (v / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : v),
                        },
                    },
                },
            },
            plugins: [glowPlugin, endMarkersPlugin],
        });

        // Keep the live dot pulsing.
        (function pulse() {
            chart.draw();
            requestAnimationFrame(pulse);
        })();
    }

    async function init() {
        let weekly2026 = null;
        try {
            const config = await (await fetch('config.json')).json();
            if (config.LOGO) {
                const logo = document.getElementById('logo');
                logo.src = config.LOGO;
                logo.hidden = false;
            }
            const response = await fetch(config.GOOGLE_APP_SCRIPT_URL);
            if (!response.ok) throw new Error('Could not fetch data from Google Apps Script');
            const payload = await response.json();
            weekly2026 = payload.weeks.map(w => w.total);
        } catch (error) {
            console.error('Dashboard Error:', error);
        }
        render(weekly2026);
    }

    init();
</script>

</body>
</html>
