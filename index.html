<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTG Campaign Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<div class="header">
    <div class="header-org">ISKCON London</div>
    <h1><span class="text-gradient">Live to Give</span> <span class="text-solid">Campaign</span></h1>
</div>

<div class="dashboard">
    <div class="chart-panel">
        <div class="chart-container"><canvas id="ltgChart"></canvas></div>
    </div>

    <div class="stats-grid">
        <div class="stat-col">
            <div class="stat-panel">
                <div class="stat-year">2025</div>
                <div class="stat-row"><span>Goal</span><strong>28,000</strong></div>
                <div class="stat-row"><span>Achieved</span><strong id="done2025">–</strong></div>
                <div class="progress-block">
                    <div class="progress-label"><span>Progress</span><strong class="accent-green">Completed</strong></div>
                    <div class="progress"><div style="width: 100%"></div></div>
                </div>
            </div>
            <div class="start-note">Campaign started <strong>Sep 8, 2025</strong></div>
        </div>
        <div class="stat-col">
            <div class="stat-panel">
                <div class="stat-year">2026</div>
                <div class="stat-row"><span>Goal</span><strong>31,000</strong></div>
                <div class="stat-row"><span>Done so far</span><strong id="done2026" class="loading">Loading...</strong></div>
                <div class="progress-block">
                    <div class="progress-label"><span>Progress</span><strong id="pct2026" class="accent-green">–</strong></div>
                    <div class="progress"><div id="progress2026"></div></div>
                </div>
            </div>
            <div class="start-note">Campaign started <strong>Sep 27, 2026</strong></div>
        </div>
    </div>
</div>

<script>
    const CAMPAIGN_2025 = {
        start: '2025-09-08',
        end: '2026-01-07',
        goal: 28000,
        weekly: [961, 674, 532, 695, 1749, 947, 700, 796, 603, 212, 898, 1730, 8237, 4720, 105, 6609, 289, 131],
    };
    const CAMPAIGN_2026 = {
        start: '2026-09-27',
        end: null,
        goal: 31000,
    };

    // x value = days since Sep 1 of the campaign's start year,
    // so the same calendar date lines up across both years.
    const DAY_MS = 24 * 60 * 60 * 1000;
    const LABEL_YEAR = 2026;

    function parseUTC(s) {
        const [y, m, d] = s.split('-').map(Number);
        return Date.UTC(y, m - 1, d);
    }
    function seasonDay(ms, year) {
        return Math.round((ms - Date.UTC(year, 8, 1)) / DAY_MS);
    }
    function fmtAxis(x) {
        return new Date(Date.UTC(LABEL_YEAR, 8, 1) + x * DAY_MS)
            .toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
    }
    function fmtDate(ms) {
        return new Date(ms).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
    }
    function todayUTC() {
        const n = new Date();
        return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
    }
    const fmtNum = n => Math.round(n).toLocaleString('en-US');

    // One point at campaign start (0), then one at the end of each reported week.
    function buildSeries(campaign, weekly) {
        const today = todayUTC();
        const startMs = parseUTC(campaign.start);
        const endMs = campaign.end ? parseUTC(campaign.end) : Infinity;
        const yr = new Date(startMs).getUTCFullYear();
        const pts = [{ x: seasonDay(startMs, yr), y: 0, week: 0 }];
        let cum = 0;
        for (let i = 0; i < weekly.length; i++) {
            const v = weekly[i];
            if (v === null || v === undefined || v === '') break;
            const weekStart = startMs + 7 * i * DAY_MS;
            const lastDay = Math.min(weekStart + 6 * DAY_MS, endMs, Math.max(weekStart, today));
            cum += Number(v);
            pts.push({ x: seasonDay(lastDay, yr) + 1, y: cum, week: i + 1, weekly: Number(v), weekStart, lastDay });
        }
        return pts;
    }

    function monthTicks(min, max) {
        const ticks = [];
        for (let m = 8; m <= 15; m++) {
            for (const d of [1, 15]) {
                const x = seasonDay(Date.UTC(LABEL_YEAR, m, d), LABEL_YEAR);
                if (x >= min && x <= max) ticks.push({ value: x });
            }
        }
        return ticks;
    }

    function render(weekly2026) {
        const css = getComputedStyle(document.documentElement);
        const gold = css.getPropertyValue('--accent-gold').trim();
        const muted = css.getPropertyValue('--text-muted').trim();
        const grid = 'rgba(140, 155, 180, 0.12)';

        const pts2025 = buildSeries(CAMPAIGN_2025, CAMPAIGN_2025.weekly);
        const pts2026 = weekly2026 ? buildSeries(CAMPAIGN_2026, weekly2026) : [];
        const total2025 = pts2025[pts2025.length - 1].y;
        const total2026 = pts2026.length ? pts2026[pts2026.length - 1].y : 0;

        // Stats
        document.getElementById('done2025').innerText = fmtNum(total2025);
        const done = document.getElementById('done2026');
        done.classList.remove('loading');
        if (weekly2026) {
            const pct = total2026 / CAMPAIGN_2026.goal * 100;
            done.innerText = fmtNum(total2026);
            document.getElementById('pct2026').innerText = pct.toFixed(1) + '%';
            document.getElementById('progress2026').style.width = Math.min(pct, 100) + '%';
        } else {
            done.innerText = 'Error';
        }

        // Axis range covers both campaigns, including the full planned 2026 span.
        const end2026X = weekly2026
            ? seasonDay(parseUTC(CAMPAIGN_2026.start) + 7 * weekly2026.length * DAY_MS, 2026) : 0;
        const allX = [...pts2025, ...pts2026].map(p => p.x).concat(end2026X);
        const minX = Math.min(...allX) - 7;
        const maxX = Math.max(...allX) + 7;

        Chart.defaults.font.family = 'Inter, sans-serif';
        Chart.defaults.color = muted;

        new Chart(document.getElementById('ltgChart'), {
            type: 'line',
            data: {
                datasets: [
                    {
                        label: '2026',
                        data: pts2026,
                        borderColor: gold,
                        backgroundColor: 'rgba(240, 180, 41, 0.12)',
                        borderWidth: 3,
                        fill: 'origin',
                        pointRadius: 4,
                        pointBackgroundColor: gold,
                    },
                    {
                        label: '2025',
                        data: pts2025,
                        borderColor: muted,
                        backgroundColor: muted,
                        borderWidth: 2,
                        borderDash: [6, 5],
                        fill: false,
                        pointRadius: 3,
                    },
                ],
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'nearest', intersect: false },
                plugins: {
                    legend: { position: 'top', labels: { usePointStyle: true, boxWidth: 8 } },
                    tooltip: {
                        backgroundColor: 'rgba(17, 24, 39, 0.96)',
                        borderColor: 'rgba(240, 180, 41, 0.5)',
                        borderWidth: 1,
                        padding: 16,
                        cornerRadius: 10,
                        caretSize: 8,
                        titleColor: '#f4f6ff',
                        titleFont: { size: 16, weight: '700' },
                        titleMarginBottom: 10,
                        bodyColor: '#f4f6ff',
                        bodyFont: { size: 15 },
                        bodySpacing: 8,
                        boxPadding: 6,
                        displayColors: false,
                        filter: item => item.raw.week > 0,
                        callbacks: {
                            title: items => {
                                const r = items[0].raw;
                                return `${items[0].dataset.label} · Week ${r.week} (${fmtDate(r.weekStart)} – ${fmtDate(r.lastDay)})`;
                            },
                            label: item => [`Week: ${fmtNum(item.raw.weekly)}`, `Total: ${fmtNum(item.raw.y)}`],
                        },
                    },
                },
                scales: {
                    x: {
                        type: 'linear',
                        min: minX,
                        max: maxX,
                        afterBuildTicks: axis => { axis.ticks = monthTicks(axis.min, axis.max); },
                        ticks: { callback: v => fmtAxis(v), autoSkip: false, maxRotation: 0 },
                        grid: { color: grid },
                    },
                    y: {
                        beginAtZero: true,
                        suggestedMax: Math.max(CAMPAIGN_2026.goal, total2025) * 1.05,
                        ticks: { callback: v => fmtNum(v) },
                        grid: { color: grid },
                    },
                },
            },
        });
    }

    async function init() {
        let weekly2026 = null;
        try {
            const config = await (await fetch('config.json')).json();
            const response = await fetch(config.GOOGLE_APP_SCRIPT_URL);
            if (!response.ok) throw new Error('Could not fetch data from Google Apps Script');
            const payload = await response.json();
            weekly2026 = payload.weeks.map(w => w.total);
        } catch (error) {
            console.error('Dashboard Error:', error);
        }
        render(weekly2026);
    }

    init();
</script>

</body>
</html>
