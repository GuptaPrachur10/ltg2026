<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live to Give Campaign · ISKCON London</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<header class="header">
    <img class="logo" id="logo" src="logo.webp" alt="ISKCON London">
    <h1>Live to Give Campaign</h1>
</header>

<main class="dashboard">
    <section class="chart-panel">
        <div class="chart-container"><canvas id="ltgChart"></canvas></div>
    </section>

    <section class="summary">
        <div class="stat-card current">
            <div class="kpis">
                <div class="kpi">
                    <div class="kpi-label">Goal</div>
                    <div class="kpi-value">31,000</div>
                </div>
                <div class="kpi">
                    <div class="kpi-label">Done so far</div>
                    <div class="kpi-value loading" id="done2026">…</div>
                </div>
                <div class="kpi">
                    <div class="kpi-label">Progress</div>
                    <div class="kpi-value green" id="pct2026">–</div>
                </div>
            </div>
            <div class="progress"><div id="progress2026"></div></div>
        </div>
        <div class="notes">
            <span class="start-note">Started <strong>27 Sep 2026</strong></span>
            <span class="start-note">Medium Gita counts <strong>1.5</strong> · Premium <strong>3</strong></span>
        </div>
    </section>
</main>

<script>
    const CAMPAIGN_2026 = {
        start: '2026-09-27',
        week1End: '2026-10-04', // Week 1 runs 27 Sep - 4 Oct (8 days); then Mon-Sun weeks (matches Code.gs)
        goal: 31000,
    };

    // Last year's campaign: shown only as a comparison line on the chart (numbers only on hover).
    const CAMPAIGN_2025 = {
        start: '2025-09-08',
        end: '2026-01-07',
        weekly: [961, 674, 532, 695, 1749, 947, 700, 796, 603, 212, 898, 1730, 8237, 4720, 105, 6609, 289, 131],
    };

    const COLORS = {
        gold: '#f0b429',
        lastYear: '#6b7499',
        legend: '#8c9bb4',
        ticks: '#8c9bb4',
        grid: 'rgba(240, 180, 41, 0.08)',
        tooltipBg: 'rgba(26, 34, 64, 0.98)',
        tooltipBorder: 'rgba(240, 180, 41, 0.25)',
        text: '#f4f6ff',
    };

    const DAY_MS = 24 * 60 * 60 * 1000;
    const nf = new Intl.NumberFormat('en-GB');

    function parseUTC(s) {
        const [y, m, d] = s.split('-').map(Number);
        return Date.UTC(y, m - 1, d);
    }
    function fmtDay(ms) {
        return new Date(ms).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
    }
    // Start/end (UTC midnight) of campaign week k (1-based), same schedule as Code.gs.
    function weekRange(k) {
        const end = parseUTC(CAMPAIGN_2026.week1End) + 7 * (k - 1) * DAY_MS;
        const start = k === 1 ? parseUTC(CAMPAIGN_2026.start) : end - 6 * DAY_MS;
        return { start, end, days: Math.round((end - start) / DAY_MS) + 1 };
    }

    // Calendar position: x = days since 1 Sep of the campaign's start year (x = start of that day),
    // so 1 Dec 2025 and 1 Dec 2026 share the same x.
    function seasonDay(ms, year) {
        return Math.round((ms - Date.UTC(year, 8, 1)) / DAY_MS);
    }
    function xToMs(x) {
        return Date.UTC(2026, 8, 1) + x * DAY_MS;
    }
    // Cumulative 2025 curve at its real week-end positions.
    function curve2025() {
        const startMs = parseUTC(CAMPAIGN_2025.start);
        const endMs = parseUTC(CAMPAIGN_2025.end);
        const pts = [{ x: seasonDay(startMs, 2025), y: 0 }];
        let cum = 0;
        CAMPAIGN_2025.weekly.forEach((v, i) => {
            const lastDay = Math.min(startMs + (7 * i + 6) * DAY_MS, endMs);
            cum += v;
            pts.push({ x: seasonDay(lastDay, 2025) + 1, y: cum });
        });
        return pts;
    }
    function valueAt(pts, x) {
        if (x <= pts[0].x) return 0;
        for (let i = 1; i < pts.length; i++) {
            if (x <= pts[i].x) {
                const a = pts[i - 1], b = pts[i];
                return a.y + (b.y - a.y) * (x - a.x) / (b.x - a.x);
            }
        }
        return pts[pts.length - 1].y;
    }

    function render(weekly2026, breakdown2026) {
        const weeks = weekly2026 || [];
        const numWeeks = Math.max(weeks.length, 1);
        const c25 = curve2025();

        // Chart points. Each point is the END of a period (x = start of the next day).
        //  - campaign start (27 Sep) and the end of each 2026 week (week: 0..numWeeks)
        //  - extra weekly points before/after so last year's line fits (week: null)
        const startX = seasonDay(parseUTC(CAMPAIGN_2026.start), 2026);
        const points = [{ x: startX, week: 0, label: fmtDay(parseUTC(CAMPAIGN_2026.start)) }];
        for (let k = 1; k <= numWeeks; k++) {
            const end = weekRange(k).end;
            points.push({ x: seasonDay(end, 2026) + 1, week: k, label: fmtDay(end) });
        }
        while (points[0].x > c25[0].x) {
            const x = points[0].x - 7;
            points.unshift({ x, week: null, label: fmtDay(xToMs(x - 1)) });
        }
        const last25 = c25[c25.length - 1].x;
        while (points[points.length - 1].x < last25) {
            const x = points[points.length - 1].x + 7;
            points.push({ x, week: null, label: fmtDay(xToMs(x - 1)) });
        }
        const labels = points.map(p => p.label);
        const idxOfWeek = k => points.findIndex(p => p.week === k);

        // Which week is today in (if any), and how many days into it.
        const now = new Date();
        const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
        let currentWeek = null, currentDay = 0;
        for (let k = 1; k <= numWeeks; k++) {
            const r = weekRange(k);
            if (today >= r.start && today <= r.end) {
                currentWeek = k;
                currentDay = Math.round((today - r.start) / DAY_MS) + 1;
            }
        }
        const currentIdx = currentWeek === null ? -1 : idxOfWeek(currentWeek);

        // Cumulative 2026 series.
        let cum = 0, stopped = false;
        const data2026 = points.map(p => {
            if (p.week === null) return null;
            if (p.week === 0) return 0;
            const v = weeks[p.week - 1];
            if (stopped || v === null || v === undefined || v === '') { stopped = true; return null; }
            cum += Number(v);
            return cum;
        });
        const total2026 = cum;

        // Cumulative 2025 series at the same calendar positions.
        let reached25 = false;
        const data2025 = points.map(p => {
            if (reached25) return null;
            if (p.x >= last25) reached25 = true;
            return Math.round(valueAt(c25, p.x));
        });

        // Per-week amounts (difference between consecutive totals).
        const toWeekly = arr => arr.map((v, i) => {
            if (v === null) return null;
            const prev = i > 0 ? arr[i - 1] : null;
            return prev === null ? null : v - prev;
        });
        const weekly2026Grid = toWeekly(data2026);
        const weekly2025Grid = toWeekly(data2025);

        const tooltipTitle = i => {
            const p = points[i];
            if (p.week >= 1) {
                const r = weekRange(p.week);
                const live = p.week === currentWeek ? '  ·  In Progress' : '';
                return `Week ${p.week}  ·  ${fmtDay(r.start)} – ${fmtDay(r.end)}${live}`;
            }
            const prevX = i > 0 ? points[i - 1].x : p.x - 7;
            return `${fmtDay(xToMs(prevX))} – ${fmtDay(xToMs(p.x - 1))}`;
        };

        // Per-type Gita counts (raw books) for the hovered week (2026 only).
        const GITA_TYPES = ['Small', 'Medium', 'Premium', 'Indian', 'Arabic'];
        const breakdownLines = i => {
            const k = points[i].week;
            const b = k >= 1 && breakdown2026 && breakdown2026[k - 1];
            if (!b) return [];
            const types = GITA_TYPES.concat(Object.keys(b).filter(t => !GITA_TYPES.includes(t)));
            return types.filter(t => b[t]).map(t => `      ${t}: ${nf.format(b[t])}`);
        };

        // Stats
        const done = document.getElementById('done2026');
        done.classList.remove('loading');
        if (weekly2026) {
            const pct = total2026 / CAMPAIGN_2026.goal * 100;
            done.textContent = nf.format(total2026);
            document.getElementById('pct2026').textContent = pct.toFixed(1) + '%';
            requestAnimationFrame(() => {
                document.getElementById('progress2026').style.width = Math.min(pct, 100) + '%';
            });
        } else {
            done.textContent = '—';
        }

        // Chart
        Chart.defaults.color = COLORS.ticks;
        Chart.defaults.font.family = "'Inter', sans-serif";

        const canvas = document.getElementById('ltgChart');
        const ctx = canvas.getContext('2d');
        const h = canvas.parentElement.clientHeight;
        const goldFill = ctx.createLinearGradient(0, 0, 0, h);
        goldFill.addColorStop(0, 'rgba(240, 180, 41, 0.35)');
        goldFill.addColorStop(0.6, 'rgba(240, 180, 41, 0.08)');
        goldFill.addColorStop(1, 'rgba(240, 180, 41, 0.0)');
        const greyFill = ctx.createLinearGradient(0, 0, 0, h);
        greyFill.addColorStop(0, 'rgba(107, 116, 153, 0.18)');
        greyFill.addColorStop(1, 'rgba(107, 116, 153, 0.0)');

        const lastIndex = arr => {
            for (let i = arr.length - 1; i >= 0; i--) if (arr[i] !== null) return i;
            return -1;
        };

        // Soft glow under the line.
        const glowPlugin = {
            id: 'glow',
            beforeDatasetDraw(chart, args) {
                if (args.index !== 0) return;
                chart.ctx.save();
                chart.ctx.shadowColor = 'rgba(240, 180, 41, 0.55)';
                chart.ctx.shadowBlur = 14;
            },
            afterDatasetDraw(chart, args) {
                if (args.index === 0) chart.ctx.restore();
            },
        };

        // Pulsing "live" dot on the latest point + value tag.
        const endMarkersPlugin = {
            id: 'endMarkers',
            afterDatasetsDraw(chart) {
                const { ctx: c, chartArea } = chart;
                if (!chart.isDatasetVisible(0)) return;
                const data = chart.data.datasets[0].data;
                const idx = lastIndex(data);
                if (idx < 0 || !(points[idx].week >= 1)) return;
                const p = chart.getDatasetMeta(0).data[idx];

                // Pulse
                const t = (performance.now() % 1800) / 1800;
                c.save();
                c.beginPath();
                c.arc(p.x, p.y, 6 + t * 14, 0, Math.PI * 2);
                c.fillStyle = `rgba(240, 180, 41, ${0.45 * (1 - t)})`;
                c.fill();
                c.beginPath();
                c.arc(p.x, p.y, 6, 0, Math.PI * 2);
                c.fillStyle = COLORS.gold;
                c.strokeStyle = '#111827';
                c.lineWidth = 2;
                c.fill();
                c.stroke();
                c.restore();

                // Tag
                const text = nf.format(data[idx]);
                c.save();
                c.font = "700 13px 'Inter', sans-serif";
                const w = c.measureText(text).width + 22;
                const th = 28;
                let x = Math.min(Math.max(p.x - w / 2, chartArea.left), chartArea.right - w);
                let y = p.y - th - 14;
                if (y < chartArea.top) y = p.y + 14;
                c.beginPath();
                c.roundRect(x, y, w, th, 14);
                c.fillStyle = COLORS.gold;
                c.shadowColor = 'rgba(0, 0, 0, 0.35)';
                c.shadowBlur = 10;
                c.fill();
                c.shadowBlur = 0;
                c.strokeStyle = COLORS.gold;
                c.lineWidth = 1;
                c.stroke();
                c.fillStyle = '#111827';
                c.textAlign = 'center';
                c.textBaseline = 'middle';
                c.fillText(text, x + w / 2, y + th / 2 + 1);
                c.restore();
            },
        };

        // Small "2025" name tag at the end of last year's line (name only, no number).
        const lastYearLabelPlugin = {
            id: 'lastYearLabel',
            afterDatasetsDraw(chart) {
                if (!chart.isDatasetVisible(1)) return;
                const idx = lastIndex(chart.data.datasets[1].data);
                if (idx < 0) return;
                const p = chart.getDatasetMeta(1).data[idx];
                const { ctx: c, chartArea } = chart;
                c.save();
                c.font = "700 13px 'Inter', sans-serif";
                c.fillStyle = COLORS.legend;
                c.textAlign = 'right';
                c.textBaseline = 'bottom';
                const x = Math.min(p.x, chartArea.right) - 4;
                const y = Math.max(p.y - 8, chartArea.top + 14);
                c.fillText('2025', x, y);
                c.restore();
            },
        };

        // Dashed horizontal line marking the 31K goal.
        const goalLinePlugin = {
            id: 'goalLine',
            beforeDatasetsDraw(chart) {
                const { ctx: c, chartArea, scales: { y } } = chart;
                const yPos = y.getPixelForValue(CAMPAIGN_2026.goal);
                if (yPos < chartArea.top || yPos > chartArea.bottom) return;
                c.save();
                c.beginPath();
                c.setLineDash([6, 6]);
                c.moveTo(chartArea.left, yPos);
                c.lineTo(chartArea.right, yPos);
                c.strokeStyle = 'rgba(52, 196, 124, 0.8)';
                c.lineWidth = 2;
                c.stroke();
                c.setLineDash([]);
                c.font = "700 13px 'Inter', sans-serif";
                c.fillStyle = '#34c47c';
                c.textAlign = 'left';
                c.textBaseline = 'bottom';
                c.fillText(`Goal ${nf.format(CAMPAIGN_2026.goal)}`, chartArea.left + 8, yPos - 6);
                c.restore();
            },
        };

        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels,
                datasets: [
                    {
                        label: '2026',
                        data: data2026,
                        borderColor: COLORS.gold,
                        backgroundColor: goldFill,
                        borderWidth: 3,
                        fill: true,
                        pointRadius: c => (points[c.dataIndex].week >= 1 && c.raw !== null ? 3.5 : 0),
                        pointBackgroundColor: '#111827',
                        pointBorderColor: COLORS.gold,
                        pointBorderWidth: 2,
                        pointHoverRadius: 7,
                        pointHoverBackgroundColor: COLORS.gold,
                        tension: 0.35,
                        spanGaps: false,
                    },
                    {
                        // Last year: line only, no end tag; numbers appear on hover.
                        label: '2025',
                        data: data2025,
                        borderColor: COLORS.lastYear,
                        backgroundColor: greyFill,
                        borderWidth: 2,
                        fill: true,
                        pointRadius: 0,
                        pointHoverRadius: 5,
                        pointHoverBackgroundColor: COLORS.lastYear,
                        tension: 0.35,
                    },
                ],
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: { padding: { top: 16, right: 12 } },
                interaction: { mode: 'index', intersect: false },
                animation: { duration: 1400, easing: 'easeOutQuart' },
                plugins: {
                    title: { display: false },
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: COLORS.tooltipBg,
                        titleColor: COLORS.text,
                        bodyColor: COLORS.text,
                        borderColor: COLORS.tooltipBorder,
                        borderWidth: 1,
                        padding: 16,
                        cornerRadius: 10,
                        titleFont: { size: 14, weight: 'bold' },
                        bodyFont: { size: 13, weight: 500 },
                        bodySpacing: 10,
                        titleMarginBottom: 12,
                        boxPadding: 8,
                        usePointStyle: true,
                        filter: c => c.parsed.y !== null && !Number.isNaN(c.parsed.y),
                        itemSort: (a, b) => a.datasetIndex - b.datasetIndex, // 2026 first, then 2025
                        callbacks: {
                            title: items => (items.length ? tooltipTitle(items[0].dataIndex) : ''),
                            label: c => {
                                const is2026 = c.datasetIndex === 0;
                                const wk = (is2026 ? weekly2026Grid : weekly2025Grid)[c.dataIndex];
                                let week = '';
                                if (wk !== null) {
                                    week = is2026 && c.dataIndex === currentIdx
                                        ? `${nf.format(wk)} so far (day ${currentDay} of ${weekRange(currentWeek).days})  ·  `
                                        : `${nf.format(wk)} this week  ·  `;
                                }
                                return `${c.dataset.label}:  ${week}${nf.format(c.parsed.y)} total`;
                            },
                            afterLabel: c => (c.datasetIndex === 0 ? breakdownLines(c.dataIndex) : []),
                            labelPointStyle: () => ({ pointStyle: 'circle', rotation: 0 }),
                            labelColor: c => {
                                const col = c.datasetIndex === 0 ? COLORS.gold : COLORS.lastYear;
                                return { borderColor: col, backgroundColor: col };
                            },
                        },
                    },
                },
                scales: {
                    x: {
                        grid: { color: COLORS.grid },
                        border: { display: false },
                        ticks: { color: COLORS.ticks, font: { size: 12, weight: 500 }, maxRotation: 0, autoSkipPadding: 16 },
                    },
                    y: {
                        beginAtZero: true,
                        suggestedMax: CAMPAIGN_2026.goal * 1.08,
                        grid: { color: COLORS.grid },
                        border: { display: false },
                        ticks: {
                            color: COLORS.ticks,
                            font: { size: 12, weight: 500 },
                            callback: v => (v >= 1000 ? (v / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : v),
                        },
                    },
                },
            },
            plugins: [goalLinePlugin, glowPlugin, lastYearLabelPlugin, endMarkersPlugin],
        });

        // Keep the live dot pulsing.
        (function pulse() {
            chart.draw();
            requestAnimationFrame(pulse);
        })();
    }

    async function init() {
        let weekly2026 = null;
        let breakdown2026 = null;
        try {
            const config = await (await fetch('config.json')).json();
            const response = await fetch(config.GOOGLE_APP_SCRIPT_URL);
            if (!response.ok) throw new Error('Could not fetch data from Google Apps Script');
            const payload = await response.json();
            weekly2026 = payload.weeks.map(w => w.total);
            breakdown2026 = payload.weeks.map(w => w.breakdown || null);
        } catch (error) {
            console.error('Dashboard Error:', error);
        }
        render(weekly2026, breakdown2026);
    }

    init();
</script>

</body>
</html>
