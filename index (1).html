<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live to Give Campaign · ISKCON London</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<header class="header">
    <img class="logo" id="logo" src="logo.webp" alt="ISKCON London">
    <h1>Live to Give Campaign</h1>
</header>

<main class="dashboard">
    <section class="chart-panel">
        <div class="chart-container"><canvas id="ltgChart"></canvas></div>
    </section>

    <section class="summary">
        <div class="stat-card current">
            <div class="kpis">
                <div class="kpi">
                    <div class="kpi-label">Goal</div>
                    <div class="kpi-value">31,000</div>
                </div>
                <div class="kpi">
                    <div class="kpi-label">Done so far</div>
                    <div class="kpi-value loading" id="done2026">…</div>
                </div>
                <div class="kpi">
                    <div class="kpi-label">Progress</div>
                    <div class="kpi-value green" id="pct2026">–</div>
                </div>
            </div>
            <div class="progress"><div id="progress2026"></div></div>
        </div>
        <div class="notes">
            <span class="start-note">Started <strong>27 Sep 2026</strong></span>
            <span class="start-note">Medium Gita counts <strong>1.5</strong> · Premium <strong>3</strong></span>
        </div>
    </section>
</main>

<script>
    const CAMPAIGN_2026 = {
        start: '2026-09-27',
        goal: 31000,
    };

    const COLORS = {
        gold: '#f0b429',
        legend: '#8c9bb4',
        ticks: '#8c9bb4',
        grid: 'rgba(240, 180, 41, 0.08)',
        tooltipBg: 'rgba(26, 34, 64, 0.98)',
        tooltipBorder: 'rgba(240, 180, 41, 0.25)',
        text: '#f4f6ff',
    };

    // x = days since 1 Sep 2026.
    const DAY_MS = 24 * 60 * 60 * 1000;
    const nf = new Intl.NumberFormat('en-GB');

    function parseUTC(s) {
        const [y, m, d] = s.split('-').map(Number);
        return Date.UTC(y, m - 1, d);
    }
    function seasonDay(ms, year) {
        return Math.round((ms - Date.UTC(year, 8, 1)) / DAY_MS);
    }
    function dayLabel(x) {
        // x is "end of day x-1"; label with that last day.
        return new Date(Date.UTC(2026, 8, 1) + (x - 1) * DAY_MS)
            .toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
    }

    function render(weekly2026, breakdown2026) {
        const weeks = weekly2026 || [];

        // Weekly grid: campaign start, then one point per week end.
        const start26 = seasonDay(parseUTC(CAMPAIGN_2026.start), 2026);
        const end26 = start26 + 7 * Math.max(weeks.length, 1);
        const grid = [];
        for (let x = start26; x <= end26; x += 7) grid.push(x);

        // Cumulative 2026 series.
        let cum = 0, stopped = false;
        const data2026 = grid.map(x => {
            if (x === start26) return 0;
            const w = (x - start26) / 7 - 1;
            const v = weeks[w];
            if (stopped || v === null || v === undefined || v === '') { stopped = true; return null; }
            cum += Number(v);
            return cum;
        });
        const total2026 = cum;

        // Per-week amounts (difference between consecutive totals).
        const weekly2026Grid = data2026.map((v, i) => {
            if (v === null) return null;
            const prev = i > 0 ? data2026[i - 1] : null;
            return prev === null ? null : v - prev;
        });

        const tooltipTitle = i => {
            const x = grid[i];
            const range = `${dayLabel(x - 6)} – ${dayLabel(x)}`;
            const w = (x - start26) / 7;
            return w >= 1 ? `Week ${w}  ·  ${range}` : range;
        };

        // Per-type Gita counts (raw books) for the hovered week.
        const GITA_TYPES = ['Small', 'Medium', 'Premium', 'Indian', 'Arabic'];
        const breakdownLines = i => {
            const w = (grid[i] - start26) / 7 - 1;
            const b = breakdown2026 && breakdown2026[w];
            if (!b) return [];
            const types = GITA_TYPES.concat(Object.keys(b).filter(t => !GITA_TYPES.includes(t)));
            return types.filter(t => b[t]).map(t => `      ${t}: ${nf.format(b[t])}`);
        };

        // Stats
        const done = document.getElementById('done2026');
        done.classList.remove('loading');
        if (weekly2026) {
            const pct = total2026 / CAMPAIGN_2026.goal * 100;
            done.textContent = nf.format(total2026);
            document.getElementById('pct2026').textContent = pct.toFixed(1) + '%';
            requestAnimationFrame(() => {
                document.getElementById('progress2026').style.width = Math.min(pct, 100) + '%';
            });
        } else {
            done.textContent = '—';
        }

        // Chart
        Chart.defaults.color = COLORS.ticks;
        Chart.defaults.font.family = "'Inter', sans-serif";

        const canvas = document.getElementById('ltgChart');
        const ctx = canvas.getContext('2d');
        const h = canvas.parentElement.clientHeight;
        const goldFill = ctx.createLinearGradient(0, 0, 0, h);
        goldFill.addColorStop(0, 'rgba(240, 180, 41, 0.35)');
        goldFill.addColorStop(0.6, 'rgba(240, 180, 41, 0.08)');
        goldFill.addColorStop(1, 'rgba(240, 180, 41, 0.0)');

        const lastIndex = arr => {
            for (let i = arr.length - 1; i >= 0; i--) if (arr[i] !== null) return i;
            return -1;
        };

        // Soft glow under the line.
        const glowPlugin = {
            id: 'glow',
            beforeDatasetDraw(chart, args) {
                if (args.index !== 0) return;
                chart.ctx.save();
                chart.ctx.shadowColor = 'rgba(240, 180, 41, 0.55)';
                chart.ctx.shadowBlur = 14;
            },
            afterDatasetDraw(chart, args) {
                if (args.index === 0) chart.ctx.restore();
            },
        };

        // Pulsing "live" dot on the latest point + value tag.
        const endMarkersPlugin = {
            id: 'endMarkers',
            afterDatasetsDraw(chart) {
                const { ctx: c, chartArea } = chart;
                if (!chart.isDatasetVisible(0)) return;
                const data = chart.data.datasets[0].data;
                const idx = lastIndex(data);
                if (idx < 1) return;
                const p = chart.getDatasetMeta(0).data[idx];

                // Pulse
                const t = (performance.now() % 1800) / 1800;
                c.save();
                c.beginPath();
                c.arc(p.x, p.y, 6 + t * 14, 0, Math.PI * 2);
                c.fillStyle = `rgba(240, 180, 41, ${0.45 * (1 - t)})`;
                c.fill();
                c.beginPath();
                c.arc(p.x, p.y, 6, 0, Math.PI * 2);
                c.fillStyle = COLORS.gold;
                c.strokeStyle = '#111827';
                c.lineWidth = 2;
                c.fill();
                c.stroke();
                c.restore();

                // Tag
                const text = nf.format(data[idx]);
                c.save();
                c.font = "700 13px 'Inter', sans-serif";
                const w = c.measureText(text).width + 22;
                const th = 28;
                let x = Math.min(Math.max(p.x - w / 2, chartArea.left), chartArea.right - w);
                let y = p.y - th - 14;
                if (y < chartArea.top) y = p.y + 14;
                c.beginPath();
                c.roundRect(x, y, w, th, 14);
                c.fillStyle = COLORS.gold;
                c.shadowColor = 'rgba(0, 0, 0, 0.35)';
                c.shadowBlur = 10;
                c.fill();
                c.shadowBlur = 0;
                c.strokeStyle = COLORS.gold;
                c.lineWidth = 1;
                c.stroke();
                c.fillStyle = '#111827';
                c.textAlign = 'center';
                c.textBaseline = 'middle';
                c.fillText(text, x + w / 2, y + th / 2 + 1);
                c.restore();
            },
        };

        // Dashed horizontal line marking the 31K goal.
        const goalLinePlugin = {
            id: 'goalLine',
            beforeDatasetsDraw(chart) {
                const { ctx: c, chartArea, scales: { y } } = chart;
                const yPos = y.getPixelForValue(CAMPAIGN_2026.goal);
                if (yPos < chartArea.top || yPos > chartArea.bottom) return;
                c.save();
                c.beginPath();
                c.setLineDash([6, 6]);
                c.moveTo(chartArea.left, yPos);
                c.lineTo(chartArea.right, yPos);
                c.strokeStyle = 'rgba(52, 196, 124, 0.8)';
                c.lineWidth = 2;
                c.stroke();
                c.setLineDash([]);
                c.font = "700 13px 'Inter', sans-serif";
                c.fillStyle = '#34c47c';
                c.textAlign = 'left';
                c.textBaseline = 'bottom';
                c.fillText(`Goal ${nf.format(CAMPAIGN_2026.goal)}`, chartArea.left + 8, yPos - 6);
                c.restore();
            },
        };

        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: grid.map(dayLabel),
                datasets: [
                    {
                        label: '2026',
                        data: data2026,
                        borderColor: COLORS.gold,
                        backgroundColor: goldFill,
                        borderWidth: 3,
                        fill: true,
                        pointRadius: c => (c.dataIndex > 0 && c.raw !== null ? 3.5 : 0),
                        pointBackgroundColor: '#111827',
                        pointBorderColor: COLORS.gold,
                        pointBorderWidth: 2,
                        pointHoverRadius: 7,
                        pointHoverBackgroundColor: COLORS.gold,
                        tension: 0.35,
                        spanGaps: false,
                    },
                ],
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: { padding: { top: 16, right: 12 } },
                interaction: { mode: 'index', intersect: false },
                animation: { duration: 1400, easing: 'easeOutQuart' },
                plugins: {
                    title: { display: false },
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: COLORS.tooltipBg,
                        titleColor: COLORS.text,
                        bodyColor: COLORS.text,
                        borderColor: COLORS.tooltipBorder,
                        borderWidth: 1,
                        padding: 16,
                        cornerRadius: 10,
                        titleFont: { size: 14, weight: 'bold' },
                        bodyFont: { size: 13, weight: 500 },
                        bodySpacing: 10,
                        titleMarginBottom: 12,
                        boxPadding: 8,
                        usePointStyle: true,
                        filter: c => c.parsed.y !== null && !Number.isNaN(c.parsed.y),
                        callbacks: {
                            title: items => (items.length ? tooltipTitle(items[0].dataIndex) : ''),
                            label: c => {
                                const wk = weekly2026Grid[c.dataIndex];
                                const week = wk === null ? '' : `${nf.format(wk)} this week  ·  `;
                                return `${c.dataset.label}:  ${week}${nf.format(c.parsed.y)} total`;
                            },
                            afterLabel: c => breakdownLines(c.dataIndex),
                            labelPointStyle: () => ({ pointStyle: 'circle', rotation: 0 }),
                            labelColor: () => ({ borderColor: COLORS.gold, backgroundColor: COLORS.gold }),
                        },
                    },
                },
                scales: {
                    x: {
                        grid: { color: COLORS.grid },
                        border: { display: false },
                        ticks: { color: COLORS.ticks, font: { size: 12, weight: 500 }, maxRotation: 0, autoSkipPadding: 16 },
                    },
                    y: {
                        beginAtZero: true,
                        suggestedMax: CAMPAIGN_2026.goal * 1.08,
                        grid: { color: COLORS.grid },
                        border: { display: false },
                        ticks: {
                            color: COLORS.ticks,
                            font: { size: 12, weight: 500 },
                            callback: v => (v >= 1000 ? (v / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : v),
                        },
                    },
                },
            },
            plugins: [goalLinePlugin, glowPlugin, endMarkersPlugin],
        });

        // Keep the live dot pulsing.
        (function pulse() {
            chart.draw();
            requestAnimationFrame(pulse);
        })();
    }

    async function init() {
        let weekly2026 = null;
        let breakdown2026 = null;
        try {
            const config = await (await fetch('config.json')).json();
            const response = await fetch(config.GOOGLE_APP_SCRIPT_URL);
            if (!response.ok) throw new Error('Could not fetch data from Google Apps Script');
            const payload = await response.json();
            weekly2026 = payload.weeks.map(w => w.total);
            breakdown2026 = payload.weeks.map(w => w.breakdown || null);
        } catch (error) {
            console.error('Dashboard Error:', error);
        }
        render(weekly2026, breakdown2026);
    }

    init();
</script>

</body>
</html>
